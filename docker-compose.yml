name: doacao-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: doacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - doacao-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doacao-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Database: ${ConnectionStrings__Database}
      RunMigrationsOnStartup: ${RunMigrationsOnStartup:-true}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-15}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-7}
      Security__BCryptWorkFactor: ${Security__BCryptWorkFactor:-12}
      SeedData__Enabled: ${SeedData__Enabled:-true}
      SeedData__AdminEmail: ${SeedData__AdminEmail}
      SeedData__AdminPassword: ${SeedData__AdminPassword}
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doacao-net

  # Opcional (dev): UI para inspecionar o PostgreSQL.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: doacao-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doacao-net

  # Frontend: SPA (React/Vite) compilada e servida por nginx, com proxy /api -> api.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doacao-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - doacao-net

volumes:
  pgdata:
    driver: local

networks:
  doacao-net:
    driver: bridge