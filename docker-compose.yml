name: doacao-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: doacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - doacao-net

  # Object storage compatível com S3 (imagens). Em produção, troque por Amazon S3
  # ajustando apenas as variáveis Storage__* da API.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: doacao-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - doacao-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doacao-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Database: ${ConnectionStrings__Database}
      RunMigrationsOnStartup: ${RunMigrationsOnStartup:-true}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__AccessTokenHours: ${Jwt__AccessTokenHours:-4}
      Jwt__RefreshTokenHours: ${Jwt__RefreshTokenHours:-8}
      Security__BCryptWorkFactor: ${Security__BCryptWorkFactor:-12}
      SeedData__Enabled: ${SeedData__Enabled:-true}
      SeedData__AdminEmail: ${SeedData__AdminEmail}
      SeedData__AdminPassword: ${SeedData__AdminPassword}
      # Object storage (MinIO via API do S3). ServiceUrl = endpoint interno;
      # PublicUrl = endpoint que o navegador usa nas URLs pré-assinadas.
      Storage__Provider: ${Storage__Provider:-MinIO}
      Storage__ServiceUrl: ${Storage__ServiceUrl:-http://minio:9000}
      Storage__PublicUrl: ${Storage__PublicUrl:-http://localhost:9000}
      Storage__Region: ${Storage__Region:-us-east-1}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${Storage__Bucket:-doacao}
      Storage__ForcePathStyle: ${Storage__ForcePathStyle:-true}
      Storage__PresignExpiryMinutes: ${Storage__PresignExpiryMinutes:-60}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - doacao-net

  # Opcional (dev): UI para inspecionar o PostgreSQL.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: doacao-pgadmin
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doacao-net

  # Frontend: SPA (React/Vite) compilada e servida por nginx, com proxy /api -> api.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doacao-frontend
    restart: unless-stopped
    environment:
      # White-label: cor primária da marca aplicada no boot (sem rebuild).
      # Vazia = usa a cor padrão do app. Ex.: BRAND_PRIMARY="#7c3aed".
      BRAND_PRIMARY: ${BRAND_PRIMARY:-}
    depends_on:
      - api
    networks:
      - doacao-net

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

networks:
  doacao-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16