map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;

    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas de API para o serviço .NET na rede do compose.
    location /api/ {
        # Resolve o hostname via DNS embutido do Docker (127.0.0.11) em runtime e
        # usa uma variável no proxy_pass para forçar a re-resolução — assim o proxy
        # sobrevive a reinícios da API (que trocam o IP do container) sem dar 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api;
        # Sem URI no proxy_pass: o caminho original (/api/...) é repassado como está.
        proxy_pass http://$upstream_api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Uploads de imagem (/api/files) podem chegar a ~10 MB.
        client_max_body_size 20m;
    }

    # SPA: qualquer rota desconhecida cai no index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets versionados (hash no nome).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
