# nginx do frontend (SPA + proxy /api). No container, este arquivo e o
# security-headers.inc viram templates em /etc/nginx/templates/ e passam por envsubst
# no boot — só ${STORAGE_PUBLIC_URL} é trocado (NGINX_ENVSUBST_FILTER no Dockerfile).

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # O add_header de uma location descarta os herdados do server, então toda
    # location com add_header próprio inclui os cabeçalhos de segurança de novo.
    include /etc/nginx/conf.d/security-headers.inc;

    # Arquivos ocultos (.env, .git…) nunca são servidos — nem caem no fallback da SPA.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Encaminha as chamadas de API para o serviço .NET na rede do compose.
    location /api/ {
        # Resolve o hostname via DNS embutido do Docker (127.0.0.11) em runtime e
        # usa uma variável no proxy_pass para forçar a re-resolução — assim o proxy
        # sobrevive a reinícios da API (que trocam o IP do container) sem dar 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api;
        # Sem URI no proxy_pass: o caminho original (/api/...) é repassado como está.
        proxy_pass http://$upstream_api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Uploads de imagem (/api/files) podem chegar a ~10 MB.
        client_max_body_size 20m;
    }

    # Páginas públicas renderizadas pela API para buscadores e prévias de link (título,
    # descrição, canonical, JSON-LD e conteúdo em <noscript>), com o app React por cima.
    # Se a API não responder, cai no index.html estático e o site continua de pé.
    location = / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api;
        proxy_pass http://$upstream_api:8080/api/public/seo/home;
        include /etc/nginx/conf.d/seo-proxy.inc;
        error_page 500 502 503 504 = @static_index;
    }

    location ^~ /pontos/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api;
        proxy_pass http://$upstream_api:8080/api/public/seo$request_uri;
        include /etc/nginx/conf.d/seo-proxy.inc;
        error_page 500 502 503 504 = @static_index;
    }

    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api;
        proxy_pass http://$upstream_api:8080/api/public/seo/sitemap.xml;
        include /etc/nginx/conf.d/seo-proxy.inc;
        error_page 500 502 503 504 = @static_sitemap;
    }

    location @static_index {
        try_files /index.html =404;
    }

    location @static_sitemap {
        try_files /sitemap.xml =404;
    }

    # Telas de acesso e área logada: funcionam normalmente, mas ficam fora do Google.
    location ~ ^/(login|forgot-password|reset-password)/?$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~ ^/app(/|$) {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Arquivos do build; qualquer outro caminho é 404 de verdade (o app mostra a página
    # "não encontrada", mas o Google não indexa a URL como se fosse a página inicial).
    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api;
        proxy_pass http://$upstream_api:8080/api/public/seo/not-found;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_not_found;
    }

    location @static_not_found {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # index.html e sw.js sem cache: um deploy chega a todos na hora.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Cache agressivo para assets versionados (hash no nome).
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
